# Publishes a GitHub Release on every `vX.Y.Z` tag, with the two assets
# Foundry's installer / The Forge expect at a stable URL:
#   .../releases/latest/download/module.json
#   .../releases/latest/download/module.zip   (files at archive root)
# The tag MUST match module.json's "version" — the job fails otherwise.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches module.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER="$(node -p "require('./module.json').version")"
          echo "tag=$TAG manifest=$VER"
          test "$TAG" = "$VER"

      - name: Build module.zip (tracked files only, archive root = module root)
        run: git archive --format=zip -o module.zip HEAD

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: |
            module.json
            module.zip
